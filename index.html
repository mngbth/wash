<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Fehi Reyru Wash</title>

<style>
* {
    margin: 0;
    padding: 0;
    box-sizing: border-box;
    font-family: 'Segoe UI', sans-serif;
}

body {
    background: #0b1f1a;
    color: #fff;
    overflow-x: hidden;
}

/* SPLASH → EXPANDS */
#splash {
    position: relative;
    width: 100%;
    min-height: 100vh;
    background: radial-gradient(circle at center, #0f3d2e, #02110c);
    display: flex;
    justify-content: center;
    align-items: center;
    flex-direction: column;
    transition: 1s ease;
}

/* compact mode (initial) */
#splash.compact {
    height: 100vh;
    overflow: hidden;
}

/* expanded mode */
#splash.expanded {
    padding-bottom: 60px;
}

/* TOP INTRO */
.intro {
    text-align: center;
    z-index: 2;
}

.intro h1 {
    font-size: 48px;
    letter-spacing: 3px;
    color: #00ffae;
}

.intro p {
    opacity: 0.7;
    margin-top: 10px;
}

/* glow */
.glow {
    width: 120px;
    height: 120px;
    border-radius: 50%;
    background: radial-gradient(#00ffae55, transparent);
    position: absolute;
    animation: pulse 2s infinite;
}

@keyframes pulse {
    0% { transform: scale(1); opacity: .5; }
    100% { transform: scale(2); opacity: 0; }
}

/* BUTTON */
.btn {
    margin-top: 25px;
    padding: 12px 28px;
    border-radius: 30px;
    border: none;
    background: linear-gradient(45deg, #00ffae, #00c853);
    color: black;
    font-weight: bold;
    cursor: pointer;
    transition: .3s;
}

.btn:hover {
    transform: scale(1.05);
}

/* HERO */
.hero {
    margin-top: 100px;
    text-align: center;
    opacity: 0;
    transform: translateY(40px);
    transition: 1s;
}

#splash.expanded .hero {
    opacity: 1;
    transform: translateY(0);
}

.hero h1 {
    font-size: 42px;
    color: #00ffae;
}

.hero p {
    margin-top: 10px;
    opacity: 0.8;
}

/* SERVICES */
.section {
    padding: 60px 20px;
    text-align: center;
    opacity: 0;
    transform: translateY(40px);
    transition: 1s;
}

#splash.expanded .section {
    opacity: 1;
    transform: translateY(0);
}

.cards {
    display: flex;
    gap: 20px;
    flex-wrap: wrap;
    justify-content: center;
    margin-top: 30px;
}

.card {
    background: rgba(255,255,255,0.05);
    padding: 20px;
    width: 250px;
    border-radius: 20px;
    backdrop-filter: blur(10px);
    transition: .3s;
}

.card:hover {
    transform: translateY(-10px);
    background: rgba(0,255,174,0.1);
}

/* FOOTER */
footer {
    text-align: center;
    padding: 20px;
    opacity: 0.6;
}

/* WHATSAPP */
.whatsapp {
    position: fixed;
    bottom: 20px;
    right: 20px;
    background: #25D366;
    padding: 15px 18px;
    border-radius: 50%;
    font-size: 20px;
    color: white;
    text-decoration: none;
}
</style>

</head>
<body>

<div id="splash" class="compact">

    <div class="glow"></div>

    <!-- INTRO -->
    <div class="intro">
        <h1>FEHI REYRU</h1>
        <p>Premium Bike Wash</p>
        <button class="btn" onclick="expand()">Enter</button>
    </div>

    <!-- HERO -->
    <div class="hero">
        <h1>Ride Clean. Shine Bright.</h1>
        <p>Professional motorbike washing service</p>
    </div>

    <!-- SERVICES -->
    <section class="section">
        <h2>Our Services</h2>

        <div class="cards">
            <div class="card">
                <h3>Basic Wash</h3>
                <p>Quick clean & rinse</p>
                <h4>Rf 100/-</h4>
            </div>

            <div class="card">
                <h3>Wash + Oil Change</h3>
                <p>Deep cleaning + engine care</p>
                <h4>Rf 200/-</h4>
            </div>

            <div class="card">
                <h3>Wash + Kit</h3>
                <p>Shine + polish finish</p>
                <h4>Rf 120/-</h4>
            </div>
        </div>
    </section>

    <footer>
        © 2026 Fehi Reyru Wash
    </footer>

</div>

<!-- WHATSAPP -->
<a class="whatsapp" href="https://wa.me/9607958020" target="_blank">💬</a>

<script>
// auto expand
setTimeout(expand, 2500);

function expand() {
    const splash = document.getElementById("splash");
    splash.classList.remove("compact");
    splash.classList.add("expanded");

    // scroll down slightly after expand (nice effect)
    setTimeout(() => {
        window.scrollTo({ top: 200, behavior: "smooth" });
    }, 600);
}
</script>

</body>
</html>
