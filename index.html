<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Fehi Reyru Wash</title>

<style>
* {
    margin: 0;
    padding: 0;
    box-sizing: border-box;
    font-family: 'Segoe UI', sans-serif;
}

body {
    background: #0b1f1a;
    color: #fff;
    overflow-x: hidden;
}

/* SPLASH SCREEN */
#splash {
    position: fixed;
    width: 100%;
    height: 100%;
    background: radial-gradient(circle at center, #0f3d2e, #02110c);
    display: flex;
    justify-content: center;
    align-items: center;
    flex-direction: column;
    z-index: 999;
    transition: 1s ease;
}

#splash h1 {
    font-size: 48px;
    letter-spacing: 3px;
    color: #00ffae;
}

#splash p {
    opacity: 0.7;
    margin-top: 10px;
}

/* water glow */
.glow {
    width: 120px;
    height: 120px;
    border-radius: 50%;
    background: radial-gradient(#00ffae55, transparent);
    position: absolute;
    animation: pulse 2s infinite;
}

@keyframes pulse {
    0% { transform: scale(1); opacity: .5; }
    100% { transform: scale(2); opacity: 0; }
}

/* MAIN CONTENT */
#main {
    opacity: 0;
    transition: 1s;
}

/* HERO */
.hero {
    height: 100vh;
    display: flex;
    justify-content: center;
    align-items: center;
    text-align: center;
    background: linear-gradient(135deg, #0b1f1a, #123c2d);
}

.hero h1 {
    font-size: 50px;
    color: #00ffae;
}

.hero p {
    margin-top: 10px;
    opacity: 0.8;
}

/* BUTTON */
.btn {
    margin-top: 25px;
    padding: 12px 28px;
    border-radius: 30px;
    border: none;
    background: linear-gradient(45deg, #00ffae, #00c853);
    color: black;
    font-weight: bold;
    cursor: pointer;
    transition: .3s;
}

.btn:hover {
    transform: scale(1.05);
}

/* SERVICES */
.section {
    padding: 60px 20px;
    text-align: center;
}

.cards {
    display: flex;
    gap: 20px;
    flex-wrap: wrap;
    justify-content: center;
}

.card {
    background: rgba(255,255,255,0.05);
    padding: 20px;
    width: 250px;
    border-radius: 20px;
    backdrop-filter: blur(10px);
    transition: .3s;
}

.card:hover {
    transform: translateY(-10px);
    background: rgba(0,255,174,0.1);
}

/* FOOTER */
footer {
    text-align: center;
    padding: 20px;
    opacity: 0.6;
}

/* FLOATING WHATSAPP */
.whatsapp {
    position: fixed;
    bottom: 20px;
    right: 20px;
    background: #25D366;
    padding: 15px 18px;
    border-radius: 50%;
    font-size: 20px;
    color: white;
    text-decoration: none;
}
</style>

</head>
<body>

<!-- SPLASH -->
<div id="splash">
    <div class="glow"></div>
    <h1>FEHI REYRU</h1>
    <p>Premium Bike Wash</p>
    <button class="btn" onclick="enterSite()">Enter</button>
</div>

<!-- MAIN -->
<div id="main">

<section class="hero">
    <div>
        <h1>Ride Clean. Shine Bright.</h1>
        <p>Professional motorbike washing service</p>
        <button class="btn">View Services</button>
    </div>
</section>

<section class="section">
    <h2>Our Services</h2>
    <div class="cards">
        <div class="card">
            <h3>Basic Wash</h3>
            <p>Quick clean & rinse</p>
            <h4>Rf 50</h4>
        </div>

        <div class="card">
            <h3>Foam Wash</h3>
            <p>Deep foam cleaning</p>
            <h4>Rf 75</h4>
        </div>

        <div class="card">
            <h3>Premium Detail</h3>
            <p>Shine + polish finish</p>
            <h4>Rf 120</h4>
        </div>
    </div>
</section>

<footer>
    © 2026 Fehi Reyru Wash
</footer>

</div>

<!-- WHATSAPP -->
<a class="whatsapp" href="https://wa.me/9607958020" target="_blank">💬</a>

<script>
// Auto enter after 2.5s
setTimeout(enterSite, 2500);

function enterSite() {
    document.getElementById("splash").style.opacity = "0";
    setTimeout(() => {
        document.getElementById("splash").style.display = "none";
        document.getElementById("main").style.opacity = "1";
    }, 800);
}
</script>

</body>
</html>
